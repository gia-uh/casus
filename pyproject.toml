[project]
name = "casus"
version = "0.1.0"
description = "A multi-agent LLM wargame harness with a deterministic resolver"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "lingo-ai>=2.1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
casus = "casus.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 96

[tool.ruff.lint]
# Keyword-argument builders read better than dict literals with quoted keys,
# and every test helper in this repo is one.
ignore = ["C408"]

[tool.ruff.lint.isort]
# `helpers` is the test-support module in tests/, not a third-party package.
known-first-party = ["casus", "helpers"]
