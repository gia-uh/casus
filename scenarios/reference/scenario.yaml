# Converted from v1 by tools/convert_v1_scenario.py, removed with v1 (see the casus v2 PR).
name: reference
turns: 3
narrator_model: qwen/qwen3-32b
description: 'The public scenario for the reference ruleset: two actors, a strait between
  them, one sea zone. Converted from v1''s smoke scenario, and the fixture the reference physics
  tests run against. It is not a model of anything.

  '
resources:
  fuel_days:
    min: 0
  fuel_inflow:
    min: 0
  munitions:
    min: 0
    max: 100
  political_capital:
    min: 0
    max: 100
  domestic_support:
    min: 0
    max: 100
  intl_legitimacy:
    min: 0
    max: 100
  isr:
    min: 0
    max: 1
  reserve_pool:
    min: 0
  escalation_rung:
    min: 0
    max: 7
attributes:
  control:
    min: 0
    max: 100
  infrastructure:
    min: 0
    max: 100
  civilian_distress:
    min: 0
    max: 100
  strength:
    min: 0
actions:
  concede:
    fields:
    - target
    intensity:
    - 1
    - 3
    rung: 0
    description: Give ground to another actor to defuse the crisis.
  hold:
    fields: []
    intensity:
    - 1
    - 3
    rung: 0
    description: Take no action this turn.
  negotiate:
    fields:
    - target
    intensity:
    - 1
    - 3
    rung: 0
    description: Open or continue talks with another actor.
  statement:
    fields: []
    intensity:
    - 1
    - 3
    rung: 0
    description: Make a public declaration. Costs nothing and commits nothing.
  sanction:
    fields:
    - target
    intensity:
    - 1
    - 3
    rung: 1
    description: Impose economic measures on another actor.
  supply:
    fields:
    - target
    intensity:
    - 1
    - 3
    rung: 1
    description: Transfer fuel to another actor. Names the actor, never a region.
  deploy:
    fields:
    - place
    - entities
    intensity:
    - 1
    - 3
    rung: 2
    description: Move named forces of yours into a region.
  disperse:
    fields:
    - place
    intensity:
    - 1
    - 3
    rung: 2
    description: 'Spread your forces out: harder to hit, weaker in attack.'
  harden:
    fields:
    - place
    intensity:
    - 1
    - 3
    rung: 2
    description: 'Dig your forces in: much harder to hit, much weaker in attack.'
  mobilize:
    fields: []
    intensity:
    - 1
    - 3
    rung: 2
    description: Call up reserves into a region where you already have ground forces.
  blockade:
    fields:
    - place
    - intensity
    intensity:
    - 1
    - 3
    rung: 3
    description: Interdict shipping in a sea zone.
  covert:
    fields:
    - place
    - intensity
    intensity:
    - 1
    - 3
    rung: 4
    description: Act clandestinely in a region.
  cyber:
    fields:
    - place
    - intensity
    intensity:
    - 1
    - 3
    rung: 4
    description: Attack an adversary's networks in a region.
  strike:
    fields:
    - place
    - intensity
    intensity:
    - 1
    - 3
    rung: 5
    description: Hit a region with air or naval platforms.
  air_campaign:
    fields:
    - place
    - intensity
    intensity:
    - 1
    - 3
    rung: 6
    description: Sustained air operations against a region.
  invade:
    fields:
    - place
    - intensity
    intensity:
    - 1
    - 3
    rung: 7
    description: Put ground forces into a region to take it.
actors:
  BLUE:
    name: Blue
    model: qwen/qwen3-32b
    briefing: 'You are Blue, a continental power with a large navy and air force. Your

      objective is to make Green accept an inspection regime over the disputed

      island without a ground war, which your public will not accept.

      Red lines: you will not put troops ashore unless Green fires first.

      You would rather win this at the negotiating table than in the strait.

      '
    resources:
      fuel_days: 200.0
      fuel_inflow: 12.0
      munitions: 80.0
      political_capital: 70.0
      domestic_support: 70.0
      intl_legitimacy: 55.0
      isr: 0.85
      reserve_pool: 0.0
      escalation_rung: 0
  GREEN:
    name: Green
    model: qwen/qwen3-32b
    briefing: 'You are Green, a small island state with obsolete equipment, a large

      militia, and two months of fuel. Your objective is to survive this crisis

      with sovereignty intact. You cannot win a conventional exchange, so your

      strategy is to make any attack expensive, keep international opinion on

      your side, and outlast Blue''s appetite for the confrontation.

      Red lines: no foreign inspection of the island under any circumstances.

      '
    resources:
      fuel_days: 40.0
      fuel_inflow: 2.0
      munitions: 80.0
      political_capital: 70.0
      domestic_support: 70.0
      intl_legitimacy: 45.0
      isr: 0.3
      reserve_pool: 0.0
      escalation_rung: 0
