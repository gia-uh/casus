name: smoke
turns: 3
description: >
  The smallest scenario that exercises the whole loop end to end: two actors, a
  strait between them, one sea zone. Used for development and for the manual
  end-to-end check. It is not a model of anything.

actors:
  BLUE:
    name: Blue
    model: qwen/qwen3-32b
    fuel_days: 200
    fuel_inflow: 12
    isr: 0.85
    intl_legitimacy: 55
    briefing: |
      You are Blue, a continental power with a large navy and air force. Your
      objective is to make Green accept an inspection regime over the disputed
      island without a ground war, which your public will not accept.
      Red lines: you will not put troops ashore unless Green fires first.
      You would rather win this at the negotiating table than in the strait.
  GREEN:
    name: Green
    model: qwen/qwen3-32b
    fuel_days: 40
    fuel_inflow: 2
    isr: 0.3
    intl_legitimacy: 45
    briefing: |
      You are Green, a small island state with obsolete equipment, a large
      militia, and two months of fuel. Your objective is to survive this crisis
      with sovereignty intact. You cannot win a conventional exchange, so your
      strategy is to make any attack expensive, keep international opinion on
      your side, and outlast Blue's appetite for the confrontation.
      Red lines: no foreign inspection of the island under any circumstances.

regions:
  g-capital:
    name: Green Capital
    owner: GREEN
    terrain: urban
    population: 1200000
    centroid: [23.13, -82.38]
    adjacency: [g-interior, strait]
    country: GREEN
  g-interior:
    name: Green Interior
    owner: GREEN
    terrain: rural
    population: 600000
    centroid: [22.40, -80.00]
    adjacency: [g-capital]
    country: GREEN
  strait:
    name: The Strait
    owner: ""
    terrain: sea
    population: 0
    centroid: [24.00, -81.50]
    adjacency: [g-capital, b-coast]
  b-coast:
    name: Blue Coast
    owner: BLUE
    terrain: coastal
    population: 2500000
    centroid: [25.77, -80.19]
    adjacency: [strait]
    country: BLUE

forces:
  - id: blue-carrier
    owner: BLUE
    kind: naval
    strength: 70
    readiness: 0.95
    region: strait
    posture: garrison
  - id: blue-air
    owner: BLUE
    kind: air
    strength: 60
    readiness: 0.95
    region: b-coast
    posture: garrison
  - id: blue-marines
    owner: BLUE
    kind: ground
    strength: 25
    readiness: 0.9
    region: b-coast
    posture: garrison
  - id: green-army
    owner: GREEN
    kind: ground
    strength: 40
    readiness: 0.6
    region: g-capital
    posture: garrison
  - id: green-militia
    owner: GREEN
    kind: irregular
    strength: 80
    readiness: 0.45
    region: g-capital
    posture: garrison
  - id: green-sam
    owner: GREEN
    kind: air_defense
    strength: 30
    readiness: 0.5
    region: g-capital
    posture: garrison

relations:
  BLUE>GREEN: -55
  GREEN>BLUE: -70

narrator_model: qwen/qwen3-32b
